model:
  name: depth-anything/Depth-Anything-V2-Small-hf
  device: auto

video:
  # 1 processes every frame; 10 processes frames 0, 10, 20, ...
  sample_every_n_frames: 1

camera:
  # Supply calibrated intrinsics here or through the motion/geometry CLI arguments.
  fx: null
  fy: null
  cx: null
  cy: null

motion:
  ratio_threshold: 0.75
  max_features: null
  minimum_matches: 8
  ransac_probability: 0.999
  ransac_threshold_pixels: 1.0
  minimum_inliers: 8
  minimum_inlier_ratio: 0.25

keyframes:
  # Stage 6 selects visually informative candidates before depth inference.
  enabled: true
  min_good_matches: 100
  min_geometric_inliers: 80
  min_geometric_inlier_ratio: 0.40
  # Pixel displacement is an image-space heuristic, not physical translation.
  min_median_feature_displacement_px: 8.0
  min_rotation_deg: 1.0
  max_frames_without_keyframe: 30

depth_geometry:
  sampling_method: bilinear

point_cloud:
  # Sample every fourth pixel in both image axes by default.
  stride: 4
  disparity_denominator_epsilon: 0.001
  # Relative-Z tail suppression for visualization; this is not depth correction.
  depth_percentile_low: 1.0
  depth_percentile_high: 99.0

map:
  # These are candidate samples; Stage 6 decides which become keyframes.
  sample_every: 10
  max_mapping_frames: 5
  # Preferred path estimates translation magnitude from relative camera Z + PnP.
  scale_mode: depth-pnp
  # Used only when scale_mode is explicitly changed to fixed-step debug mode.
  translation_step: 1.0
  minimum_pnp_correspondences: 6
  minimum_pnp_inliers: 6
  minimum_pnp_inlier_ratio: 0.25
  pnp_reprojection_error_pixels: 3.0
  point_cloud_stride: 6
  # Voxel size is expressed in relative map units, not metres.
  voxel_size: 0.05
  disparity_denominator_epsilon: 0.001
  # Applied only to relative depth; metric depth is not percentile-filtered.
  depth_percentile_low: 1.0
  depth_percentile_high: 99.0
  # Center-distance tail suppression after voxel downsampling.
  global_outlier_percentile: 99.5
  # Heuristic pre-filter gates for aligned relative-depth reconstruction.
  min_valid_depth_ratio: 0.60
  max_denominator_reject_ratio: 0.30
  min_depth_alignment_inliers: 500
  min_depth_alignment_inlier_ratio: 0.30
  max_relative_z_p99_over_median: 50.0

pose_refinement_3d:
  # Optional local refinement; disabled preserves the established PnP path.
  enabled: false
  minimum_correspondences: 100
  minimum_inliers: 80
  minimum_inlier_ratio: 0.40
  minimum_relative_improvement: 0.10
  random_seed: 0
  ransac_iterations: 512
  # Adaptive RANSAC threshold as a fraction of robust matched-point spread.
  residual_threshold_fraction: 0.05
  # Reject candidates that depart too far from the accepted PnP initialization.
  maximum_translation_change_ratio: 2.0
  maximum_rotation_change_degrees: 10.0

depth_stabilization:
  # Optional experiment applied only to point-cloud fusion after alignment.
  enabled: false
  # Reject a positive Z sample only when it exceeds both conservative bounds.
  max_z_over_median: 12.0
  mad_multiplier: 8.0
  minimum_valid_ratio: 0.70
  # Fall back to the original depth map instead of removing too many samples.
  maximum_removed_ratio: 0.20

temporal_depth_normalization:
  # Optional pairwise relative-Z scale experiment; never changes mapper poses.
  enabled: false
  minimum_correspondences: 200
  minimum_inliers: 150
  minimum_inlier_ratio: 0.50
  minimum_scale: 0.70
  maximum_scale: 1.30
  maximum_log_mad: 0.25
  minimum_cumulative_scale: 0.50
  maximum_cumulative_scale: 2.0
  log_mad_outlier_multiplier: 3.5

trajectory_refinement:
  # Stage 8 is opt-in and never overwrites the raw accepted-pose trajectory.
  enabled: false
  mode: jump_aware
  # Heuristic threshold: median step + multiplier * 1.4826 * MAD.
  mad_multiplier: 4.0
  # Position-only local average; rotations are never averaged element-wise.
  moving_average_weights: [0.25, 0.50, 0.25]

visual_output:
  # Presentation artifacts are enabled by default and never replace raw data.
  save_previews: true
  save_display_clean: true
  # Conservative, deterministic display-only point-cloud filtering.
  display_z_percentile_min: 1.0
  display_z_percentile_max: 99.0
  display_center_distance_percentile: 99.5
  display_center_mad_multiplier: 6.0
  # Set both Z percentiles or the center-distance percentile to null to disable.
  # Plotting is deterministically subsampled; exported PLY files are not.
  preview_max_points: 40000
  overview_max_points: 20000

diagnostics:
  # Read-only accepted-keyframe drift tables and plots; never affects mapping.
  save_drift_diagnostics: true

pose_chain_diagnostics:
  # Isolated direct reference-to-keyframe SIFT/Essential/PnP checks.
  enabled: false
  # Direct estimates below these existing-quality levels are low confidence.
  minimum_geometric_inlier_ratio: 0.25
  minimum_pnp_inlier_ratio: 0.25
  maximum_reprojection_rmse_pixels: 3.0
  # Heuristic-only drift flags; these never reject or alter mapper poses.
  translation_relative_difference_threshold: 0.25
  rotation_difference_threshold_deg: 5.0
  increasing_fraction_threshold: 0.70

output:
  directory: outputs
