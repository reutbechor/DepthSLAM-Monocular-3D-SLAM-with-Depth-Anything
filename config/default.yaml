model:
  name: depth-anything/Depth-Anything-V2-Small-hf
  device: auto

video:
  # 1 processes every frame; 10 processes frames 0, 10, 20, ...
  sample_every_n_frames: 1

camera:
  # Supply calibrated intrinsics here or through the motion/geometry CLI arguments.
  fx: null
  fy: null
  cx: null
  cy: null

motion:
  ratio_threshold: 0.75
  max_features: null
  minimum_matches: 8
  ransac_probability: 0.999
  ransac_threshold_pixels: 1.0
  minimum_inliers: 8
  minimum_inlier_ratio: 0.25

depth_geometry:
  sampling_method: bilinear

point_cloud:
  # Sample every fourth pixel in both image axes by default.
  stride: 4

output:
  directory: outputs
